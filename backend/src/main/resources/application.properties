spring.application.name=researchmate-backend

# Database Configuration (MySQL production with env overrides)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/researchmate?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security & JWT Configuration
jwt.secret=${JWT_SECRET:researchmate-secret-key-change-this-to-a-very-long-random-secret-key-for-hmac-sha256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload Configuration (10MB limit)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
researchmate.storage.upload-dir=${UPLOAD_DIR:uploads/papers}

# AI & LLM Service Configuration
researchmate.ai.llm-api-key=${LLM_API_KEY:}
researchmate.ai.llm-endpoint=${LLM_ENDPOINT:https://api.openai.com/v1/chat/completions}
researchmate.ai.embedding-api-key=${EMBEDDING_API_KEY:}