spring.application.name=researchmate-backend-test
spring.datasource.url=jdbc:h2:mem:researchmatedb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=researchmate-test-secret-key-for-unit-and-integration-tests-only-min-256-bits
jwt.expiration=3600000

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
researchmate.storage.upload-dir=target/test-uploads

researchmate.ai.llm-api-key=
researchmate.ai.llm-endpoint=
researchmate.ai.embedding-api-key=
