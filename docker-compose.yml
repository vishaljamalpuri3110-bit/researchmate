services:
  mysql:
    image: mysql:8.0
    container_name: researchmate-mysql
    environment:
      MYSQL_DATABASE: researchmate
      MYSQL_ROOT_PASSWORD: researchmate_root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-presearchmate_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: researchmate-backend
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/researchmate?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: researchmate_root

      JWT_SECRET: change-this-to-a-long-random-secret
      JWT_EXPIRATION: 86400000

      LLM_API_KEY: ${LLM_API_KEY}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      UPLOAD_DIR: /app/uploads/papers
    volumes:
      - ./backend/uploads:/app/uploads

volumes:
  mysql_data: