<div class="auth-page">

  <div class="auth-card">

    <div class="auth-logo">
      <i class="bi bi-shield-lock"></i>
    </div>

    <span class="eyebrow">RESEARCHMATE</span>

    <h1>Reset your password</h1>

    <p class="subtitle">
      Choose a new password for your ResearchMate account.
    </p>

    <div *ngIf="errorMsg" class="alert error-alert">
      <i class="bi bi-exclamation-circle"></i>
      {{ errorMsg }}
    </div>

    <div *ngIf="successMsg" class="alert success-alert">
      <i class="bi bi-check-circle"></i>
      {{ successMsg }}
    </div>

    <form
      *ngIf="token"
      [formGroup]="form"
      (ngSubmit)="onSubmit()">

      <div class="form-group">

        <label for="password">New password</label>

        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="Minimum 8 characters"
          autocomplete="new-password"
        />

        <small
          class="field-error"
          *ngIf="
            form.get('password')?.touched &&
            form.get('password')?.hasError('required')
          ">
          Password is required.
        </small>

        <small
          class="field-error"
          *ngIf="
            form.get('password')?.touched &&
            form.get('password')?.hasError('minlength')
          ">
          Password must contain at least 8 characters.
        </small>

      </div>

      <div class="form-group">

        <label for="confirmPassword">Confirm password</label>

        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          placeholder="Re-enter your password"
          autocomplete="new-password"
        />

        <small
          class="field-error"
          *ngIf="
            form.get('confirmPassword')?.touched &&
            form.get('confirmPassword')?.value &&
            !passwordsMatch()
          ">
          Passwords do not match.
        </small>

      </div>

      <button
        type="submit"
        class="primary-button"
        [disabled]="loading">

        {{ loading ? 'Resetting...' : 'Reset password' }}

      </button>

    </form>

    <a routerLink="/login" class="back-link">
      <i class="bi bi-arrow-left"></i>
      Back to login
    </a>

  </div>

</div>
